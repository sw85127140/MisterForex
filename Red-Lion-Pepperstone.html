<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myfxbook Widget (靠左對齊+超連結)</title>

    <style>
        body {
            /* 移除所有內外邊距 */
            margin: 0;
            
            /* 左右留一點空間，避免圖片緊貼螢幕邊緣 */
            padding: 0 20px; 
            
            /* 使用 Flexbox */
            display: flex;

            /* 將 center (置中) 改為 flex-start (從頭開始)，即可靠左對齊 */
            justify-content: flex-start; 
            
            /* 繼續保持垂直置中 */
            align-items: center;

            /* 確保佈局至少有一個螢幕的高度 */
            min-height: 100vh; 
            
            /* 避免 padding 造成卷軸 */
            box-sizing: border-box;
        }

        .fx-widget-image {
            /* 圖片樣式維持不變 */
            width: auto;
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>

<body>

    <!-- 這裡加入了超連結，並更新了最新的 Account OID -->
    <a href="https://www.myfxbook.com/members/sagen520/red-lion-pepperstone/12067273" target="_blank" rel="noopener noreferrer">
        <img class="fx-widget-image" alt="widget" src="https://widget.myfxbook.com/widget/widget.png?accountOid=12067273&type=6">
    </a>

</body>
</html>
